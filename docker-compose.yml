# v2 opt-in deployment; original MySQL Compose preserved in Git history.
services:
  web:
    build:
      context: .
      dockerfile: modern/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
