name: Modern Flask smoke tests
on:
  push:
    branches:
      - 'modernize/**'
  pull_request:
    paths:
      - 'modern/**'
      - 'tests/**'
      - '.github/workflows/modern.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r modern/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q modern
